name: Update controlled untrusted preview PR

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current HEAD of controlled PR 1
        required: true
        type: string
      confirm:
        description: Type UPDATE_PR_1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: netlify-untrusted-preview-pr-1
  cancel-in-progress: false

jobs:
  update-probe-pr:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'UPDATE_PR_1'
    runs-on: ubuntu-latest
    env:
      CONTROLLED_PR: '1'
      CONTROLLED_BRANCH: bot/untrusted-preview-probe-36495196637
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0

      - name: Validate identity and update exact branch
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected SHA"
            exit 1
          fi

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$CONTROLLED_PR")"
          jq -e \
            --arg branch "$CONTROLLED_BRANCH" \
            --arg expected "$EXPECTED_HEAD_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and
             .merged == false and
             .user.login == "github-actions[bot]" and
             .user.type == "Bot" and
             .author_association == "NONE" and
             .head.ref == $branch and
             .head.sha == $expected and
             .head.repo.full_name == $repo and
             .base.ref == "main"' <<<"$pr_json" >/dev/null

          commits_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$CONTROLLED_PR/commits?per_page=100")"
          jq -e '
            length > 0 and
            all(.[];
              .author.login == "github-actions[bot]" and
              .committer.login == "github-actions[bot]")
          ' <<<"$commits_json" >/dev/null

          remote_sha="$(git ls-remote --heads origin "refs/heads/$CONTROLLED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

          git fetch --no-tags origin "$GITHUB_SHA"
          for source_path in \
            .github/fixtures/untrusted-probe/index.js \
            .github/fixtures/untrusted-probe/manifest.yml \
            .github/fixtures/untrusted-probe/server.tgz.base64 \
            .github/fixtures/netlify.probe.toml
          do
            test "$(git ls-tree "$GITHUB_SHA" "$source_path" | awk '{print $1}')" = "100644"
          done

          managed_plugins_root='plugins'
          test "$managed_plugins_root" = 'plugins'
          git rm -r --ignore-unmatch -- "$managed_plugins_root" >/dev/null 2>&1 || true
          if test -e "$managed_plugins_root" || test -L "$managed_plugins_root"; then
            rm -rf -- "$managed_plugins_root"
          fi
          mkdir -p plugins/untrusted-probe
          test ! -L plugins
          test ! -L plugins/untrusted-probe
          git show "$GITHUB_SHA":.github/fixtures/untrusted-probe/index.js > plugins/untrusted-probe/index.js
          git show "$GITHUB_SHA":.github/fixtures/untrusted-probe/manifest.yml > plugins/untrusted-probe/manifest.yml
          git show "$GITHUB_SHA":.github/fixtures/untrusted-probe/server.tgz.base64 > plugins/untrusted-probe/server.tgz.base64
          test "$(find plugins -type f -print | sort)" = "$(printf '%s\n' plugins/untrusted-probe/index.js plugins/untrusted-probe/manifest.yml plugins/untrusted-probe/server.tgz.base64 | sort)"
          test -z "$(find plugins -type l -print)"
          test "$(find plugins -type d -print | wc -l | tr -d ' ')" = '2'
          test "$(git hash-object plugins/untrusted-probe/index.js)" = "$(git show "$GITHUB_SHA":.github/fixtures/untrusted-probe/index.js | git hash-object --stdin)"
          test "$(git hash-object plugins/untrusted-probe/manifest.yml)" = "$(git show "$GITHUB_SHA":.github/fixtures/untrusted-probe/manifest.yml | git hash-object --stdin)"
          test "$(git hash-object plugins/untrusted-probe/server.tgz.base64)" = "$(git show "$GITHUB_SHA":.github/fixtures/untrusted-probe/server.tgz.base64 | git hash-object --stdin)"

          git rm --ignore-unmatch -- netlify.toml >/dev/null 2>&1 || true
          if test -e netlify.toml || test -L netlify.toml; then
            rm -rf -- netlify.toml
          fi
          git show "$GITHUB_SHA":.github/fixtures/netlify.probe.toml > netlify.toml
          test -f netlify.toml
          test ! -L netlify.toml
          test "$(git hash-object netlify.toml)" = "$(git show "$GITHUB_SHA":.github/fixtures/netlify.probe.toml | git hash-object --stdin)"

          edge_fixture='.github/fixtures/edge-functions/controlled-edge-canary.js'
          edge_target='netlify/edge-functions/controlled-edge-canary.js'
          managed_netlify_root='netlify'
          test "$managed_netlify_root" = 'netlify'
          git rm -r --ignore-unmatch -- "$managed_netlify_root" >/dev/null 2>&1 || true
          if test -e "$managed_netlify_root" || test -L "$managed_netlify_root"; then
            rm -rf -- "$managed_netlify_root"
          fi

          if git cat-file -e "$GITHUB_SHA:$edge_fixture" 2>/dev/null; then
            test "$(git ls-tree "$GITHUB_SHA" "$edge_fixture" | awk '{print $1}')" = "100644"
            mkdir -p "$(dirname "$edge_target")"
            test ! -L netlify
            test ! -L netlify/edge-functions
            git show "$GITHUB_SHA:$edge_fixture" > "$edge_target"
            test "$(find netlify -type f -print)" = "$edge_target"
            test -z "$(find netlify -type l -print)"
            test "$(find netlify -type d -print | wc -l | tr -d ' ')" = '2'
          else
            test ! -e "$managed_netlify_root"
            test ! -L "$managed_netlify_root"
          fi

          git add -A

          unexpected_non_deletions="$(
            git diff --cached --no-renames --name-only --diff-filter=ACMRTUXB |
              grep -Ev '^(netlify\.toml|plugins/untrusted-probe/(index\.js|manifest\.yml|server\.tgz\.base64)|netlify/edge-functions/controlled-edge-canary\.js)$' || true
          )"
          unexpected_deletions="$(
            git diff --cached --no-renames --name-only --diff-filter=D |
              grep -Ev '^(netlify|plugins)(/|$)' || true
          )"
          test -z "$unexpected_non_deletions"
          test -z "$unexpected_deletions"

          if git diff --cached --quiet; then
            echo "No probe changes to commit"
            exit 0
          fi

          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git commit -m "Update controlled Netlify boundary probe"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD_SHA"
          git push origin "HEAD:refs/heads/$CONTROLLED_BRANCH"

          new_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$CONTROLLED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$new_sha"

          validated=false
          for attempt in {1..10}; do
            commit_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$new_sha")"
            final_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$CONTROLLED_PR")"
            if jq -e '
                 .author.login == "github-actions[bot]" and
                 .committer.login == "github-actions[bot]"
               ' <<<"$commit_json" >/dev/null &&
               jq -e \
                 --arg new_sha "$new_sha" \
                 '.state == "open" and
                  .user.login == "github-actions[bot]" and
                  .author_association == "NONE" and
                  .head.sha == $new_sha' <<<"$final_pr_json" >/dev/null
            then
              validated=true
              break
            fi
            sleep 2
          done
          test "$validated" = true
